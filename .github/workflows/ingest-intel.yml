name: Headless Intel Ingestion Pipeline

on:
  schedule:
    # Run every 15 minutes (96 runs/day - well below all free tier ceilings)
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: intel-ingest
  cancel-in-progress: true

jobs:
  ingest:
    name: Ingest, Classify & Cluster Defense OSINT
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Execute Headless Ingestion & Live Resolver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ingest.py
