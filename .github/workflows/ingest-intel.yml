name: Headless Intel Ingestion Pipeline

on:
  schedule:
    # Run every 30 minutes (48 runs/day - writes strictly to Supabase with zero repo commits)
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-intel
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest, Classify & Cluster Defense OSINT
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Execute Headless Ingestion & Live Resolver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/ingest.py
