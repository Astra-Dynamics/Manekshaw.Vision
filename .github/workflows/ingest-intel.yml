name: Headless Intel Ingestion Pipeline

on:
  schedule:
    # Run every 30 minutes (48 runs/day - well below all free tier ceilings)
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-intel
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest, Classify & Cluster Defense OSINT
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Execute Headless Ingestion & Live Resolver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/ingest.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            # We use [skip actions] instead of [skip ci] so Vercel can still deploy if needed,
            # while preventing recursive GitHub Actions workflow execution.
            git commit -m "chore(intel): update ingested telemetry data [skip actions]"
            git push
          else
            echo "Working tree clean. No changes to commit (skipping empty commit to avoid redundant Vercel builds)."
          fi
