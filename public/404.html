<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Not Found | Manekshaw.Vision</title>
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #06090e;
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      border: 1px solid rgba(244, 63, 94, 0.3);
      background: rgba(15, 23, 42, 0.6);
      padding: 40px 30px;
      border-radius: 6px;
      max-width: 440px;
      margin: 20px;
    }
    h1 {
      color: #fff;
      font-size: 24px;
      margin-top: 10px;
      margin-bottom: 8px;
    }
    .tag {
      color: #f43f5e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #0ea5e9;
      color: #020617;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .btn:hover {
      background: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">ERROR 404 // SECTOR NOT FOUND</div>
